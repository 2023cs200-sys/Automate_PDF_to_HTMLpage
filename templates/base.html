<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The BOSAT — Vesak 2570 / 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f4efe8;
            --surface: #ffffff;
            --text: #2d1b0e;
            --text-light: #7a6a5a;
            --accent: #b83a2a;
            --gold: #d4a853;
            --gold-light: #e8d5a8;
            --border: #e0d5c5;
            --shadow: 0 1px 12px rgba(0,0,0,0.06);
            --radius: 10px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans Sinhala', 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.85;
            font-size: 16.5px;
        }

        .masthead {
            text-align: center;
            padding: 36px 20px 30px;
            background: var(--surface);
            box-shadow: var(--shadow);
            margin-bottom: 36px;
            border-radius: var(--radius);
        }

        .masthead h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--accent);
            letter-spacing: 4px;
            font-weight: 700;
        }

        .masthead .sub {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .page-main {
            margin-left: 220px;
            min-height: 100vh;
        }

        .content {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .hero {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        .hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        .topic-section {
            background: var(--surface);
            padding: 48px 52px 44px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .topic-section:target {
            animation: highlight 2s ease;
        }

        @keyframes highlight {
            0% { box-shadow: 0 0 0 3px var(--gold-light); }
            100% { box-shadow: var(--shadow); }
        }

        .topic-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--accent);
            font-weight: 700;
            text-align: center;
            padding-bottom: 16px;
            margin-bottom: 28px;
            border-bottom: none;
            position: relative;
        }

        .topic-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--gold);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        .topic-title .topic-no {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .topic-section p {
            margin-bottom: 16px;
            text-align: justify;
            word-break: break-word;
            line-height: 1.9;
        }

        .topic-section h3 {
            font-family: 'Playfair Display', 'Noto Sans Sinhala', serif;
            font-size: 22px;
            font-weight: 700;
            color: #3a2214;
            text-align: center;
            margin: 32px 0 16px;
            line-height: 1.3;
        }

        .topic-section h4 {
            font-family: 'Noto Sans Sinhala', 'Source Serif 4', serif;
            font-size: 17px;
            font-weight: 600;
            color: #5a3a20;
            text-align: center;
            margin: 24px 0 12px;
            line-height: 1.35;
            font-style: italic;
        }

        .topic-section strong {
            font-weight: 600;
            color: #4a2e1a;
        }

        .topic-section em {
            font-style: italic;
            color: #5a4030;
        }

        .image-wrapper {
            text-align: center;
            margin: 28px 0;
        }

        .image-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
        }

        .back-to-top {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-to-top:hover {
            color: var(--accent);
        }

        /* ===== Nav Sidebar ===== */
        .nav-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .nav-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            background: var(--surface);
            box-shadow: 2px 0 16px rgba(0,0,0,0.08);
            z-index: 999;
            overflow-y: auto;
            padding: 24px 0;
            transform: translateX(0);
            transition: transform 0.3s;
        }

        .nav-sidebar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .nav-sidebar ul {
            list-style: none;
        }

        .nav-sidebar li { padding: 0; }

        .nav-sidebar a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-sidebar a:hover,
        .nav-sidebar a.active {
            background: var(--bg);
            color: var(--accent);
            border-left-color: var(--gold);
        }

        .nav-sidebar .nav-num {
            font-family: 'Playfair Display', serif;
            font-size: 11px;
            color: var(--gold);
            font-weight: 600;
            min-width: 20px;
            flex-shrink: 0;
        }

        .nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 998;
        }

        @media (max-width: 768px) {
            .nav-toggle { display: block; }
            .nav-sidebar {
                transform: translateX(-100%);
            }
            .nav-sidebar.open {
                transform: translateX(0);
            }
            .nav-overlay.open {
                display: block;
            }
            .page-main {
                margin-left: 0;
            }
            .content {
                padding: 0 14px 40px;
            }

            .topic-section {
                padding: 28px 18px 24px;
            }

            .topic-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>

    <nav class="nav-sidebar" id="navSidebar">
        <h2>Articles</h2>
        <ul>
            {{NAV_LINKS}}
        </ul>
    </nav>

    <div class="nav-overlay" id="navOverlay"></div>

    <div class="page-main">
        <header class="masthead">
            <h1>THE BOSAT</h1>
            <div class="sub">Vesak 2570 / 2026 &middot; Vol.1 No.5</div>
        </header>

        <main class="content">
            {{CONTENT}}
        </main>
    </div>

<script>
    const toggle = document.getElementById('navToggle');
    const sidebar = document.getElementById('navSidebar');
    const overlay = document.getElementById('navOverlay');

    function openNav() {
        sidebar.classList.add('open');
        overlay.classList.add('open');
    }

    function closeNav() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
    }

    toggle.addEventListener('click', openNav);
    overlay.addEventListener('click', closeNav);

    document.querySelectorAll('.nav-sidebar a').forEach(a => {
        a.addEventListener('click', closeNav);
    });

    // Highlight active section on scroll
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            const link = document.querySelector(`.nav-sidebar a[href="#${entry.target.id}"]`);
            if (entry.isIntersecting) {
                document.querySelectorAll('.nav-sidebar a').forEach(a => a.classList.remove('active'));
                if (link) link.classList.add('active');
            }
        });
    }, { rootMargin: '-50% 0px -50% 0px' });

    document.querySelectorAll('.topic-section').forEach(s => observer.observe(s));
</script>
</body>
</html>
